[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reteco"
version = "0.1.0"
description = "SemEval-2027 RETECO Sub-track 1a (Temporal Retrieval) course project"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
