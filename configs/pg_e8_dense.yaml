# Playground E8 dense config. Rebuild the query encoder: python -m reteco.playground.finetune_qenc --name bge_q --epochs 3 (epoch2 is used).
system_name: pg_e8_dense
description: dense_best with the query encoder fine-tuned on tune_train against frozen
  doc embeddings (playground E8, epoch 2)
model: BAAI/bge-small-en-v1.5
dtype: float16
domains: all
doc_mode: first
doc_max_tokens: 512
query_prefix: 'Represent this sentence for searching relevant passages: '
query_max_tokens: 512
batch_size: 64
shard_size: 8192
depth: 100
candidate_depth: 1000
seed: 13
query_model: cache/playground/qenc/bge_q/epoch2
