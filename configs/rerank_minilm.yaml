# Cross-encoder reranking of hybrid_best with cross-encoder/ms-marco-MiniLM-L-6-v2 (22M), the fast comparison.
# Reranking depth chosen on train (5 small domains, interpolated nDCG@10) from {50, 100, 200}; see docs/RERANK.md.
system_name: rerank_minilm
description: "ms-marco-MiniLM-L-6-v2 cross-encoder"
first_stage: hybrid_best
model: cross-encoder/ms-marco-MiniLM-L-6-v2
dtype: float16
max_length: 512
max_query_tokens: 256
doc_chars: 4000
batch_size: 32
query_clean: [code, html, urls, signature]   # same steps as sparse_best
depth: 200
domains: all
interpolate:
  tune: true          # a in {0, 0.05, ..., 1} x norm in {minmax, zscore}, train macro nDCG@10
seed: 13
