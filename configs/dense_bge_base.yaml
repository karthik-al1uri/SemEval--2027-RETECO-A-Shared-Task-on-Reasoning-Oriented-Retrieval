# Base-model variant (small domains only): bge-base, first 512 tokens per document.
system_name: dense_bge_base
description: "bge-base-en-v1.5 fp16, first 512 doc tokens, bge query instruction, HTML-stripped query (512 tok), small domains only"
model: BAAI/bge-base-en-v1.5
dtype: float16
domains: small
doc_mode: first
doc_max_tokens: 512
query_prefix: "Represent this sentence for searching relevant passages: "
query_max_tokens: 512
batch_size: 64
shard_size: 8192
depth: 100
candidate_depth: 1000
seed: 13
