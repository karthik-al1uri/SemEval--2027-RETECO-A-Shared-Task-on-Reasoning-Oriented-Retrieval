# Round-2 R2-E3: the round-1 champion (configs/final.yaml) with fusion reverted to round-1's original
# setting (k 20, w_dense 0.5), i.e. without playground E5. Same fine-tuned models.
system_name: pg2_e3
seed: 13
components:
  sparse: true
  dense: true
  rerank: true
  interpolate: true
  temporal: true
  dedup: true
sparse:
  config: configs/sparse_best.yaml
dense:
  config: configs/pg_e20_dense.yaml
fusion:
  k: 20
  w_dense: 0.5
  depth: 1000
rerank:
  model: cache/playground/ce/minilm_ft_q128_all/epoch1
  dtype: float16
  max_length: 512
  max_query_tokens: 128
  doc_chars: 4000
  batch_size: 32
  query_clean:
  - code
  - html
  - urls
  - signature
  depth: 200
interpolate:
  a: 0.35
  norm: zscore
temporal:
  config: configs/rerank_temporal_fit_present.yaml
dedup:
  config: configs/final_dedup_end.yaml
