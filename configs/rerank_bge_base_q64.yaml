# Cross-encoder reranking of hybrid_best with BAAI/bge-reranker-base (XLM-R base, 278M).
# Reranking depth chosen on train (5 small domains) from {50, 100, 200}; see docs/RERANK.md.
system_name: rerank_bge_base_q64
description: "bge-reranker-base cross-encoder, query cut to 64 tokens"
first_stage: hybrid_best
model: BAAI/bge-reranker-base
dtype: float16
max_length: 512
max_query_tokens: 64
doc_chars: 4000
batch_size: 32
query_clean: [code, html, urls, signature]   # same steps as sparse_best
depth: 100
domains: all
interpolate:
  tune: true          # a in {0, 0.05, ..., 1} x norm in {minmax, zscore}, train macro nDCG@10
seed: 13
