# Playground E20 dense config. Rebuild: python -m reteco.playground.finetune_qenc --name bge_q_all --epochs 2 --train-on tune (epoch2).
system_name: pg_e20_dense
description: dense_best with the query encoder fine-tuned on all tune queries (playground
  E20, epoch 2 fixed from E8)
model: BAAI/bge-small-en-v1.5
dtype: float16
domains: all
doc_mode: first
doc_max_tokens: 512
query_prefix: 'Represent this sentence for searching relevant passages: '
query_max_tokens: 512
batch_size: 64
shard_size: 8192
depth: 100
candidate_depth: 1000
seed: 13
query_model: cache/playground/qenc/bge_q_all/epoch2
