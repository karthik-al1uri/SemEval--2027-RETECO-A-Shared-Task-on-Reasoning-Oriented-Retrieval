# Round-2 R2-E6b: R2-E6a with the second cross-encoder view scored by a MiniLM fine-tuned on the LLM-rewritten
# queries (E20 recipe, query text = the Qwen short query). Rebuild:
#   python -m reteco.playground.finetune_ce --config configs/final_v1.yaml --name minilm_ft_rwq_all --epochs 2 \
#     --stop-after-epoch 1 --n-neg 7 --groups-per-step 4 --micro-groups 2 --max-query-tokens 128 --train-on tune \
#     --query-rewrite Qwen/Qwen2.5-1.5B-Instruct:query
system_name: pg2_e6b
seed: 13
components:
  sparse: true
  dense: true
  rerank: true
  interpolate: true
  temporal: true
  dedup: true
sparse:
  config: configs/sparse_best.yaml
dense:
  config: configs/pg_e20_dense.yaml
fusion:
  k: 20
  w_dense: 0.5
  depth: 1000
rerank:
  model: cache/playground/ce/minilm_ft_q128_all/epoch1
  dtype: float16
  max_length: 512
  max_query_tokens: 128
  doc_chars: 4000
  batch_size: 32
  query_clean:
  - code
  - html
  - urls
  - signature
  depth: 200
  rewrite_query:
    model: Qwen/Qwen2.5-1.5B-Instruct
    mode: query
    w: 0.5
    ce_model: cache/playground/ce/minilm_ft_rwq_all/epoch1
interpolate:
  a: 0.35
  norm: zscore
temporal:
  config: configs/rerank_temporal_fit_present.yaml
dedup:
  config: configs/final_dedup_end.yaml
rewrite:
  model: Qwen/Qwen2.5-1.5B-Instruct
  lists:
  - mode: query
    stage: sparse
    w: 0.25
  - mode: query
    stage: dense
    encoder: query
    w: 0.25
