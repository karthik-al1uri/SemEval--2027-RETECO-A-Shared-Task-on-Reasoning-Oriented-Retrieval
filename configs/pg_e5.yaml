# Playground E5: fusion (k, w_dense) re-tuned on tune_val with the E1 reranker on top.
system_name: pg_e5
seed: 13
components:
  sparse: true
  dense: true
  rerank: true
  interpolate: true
  temporal: true
  dedup: true
sparse:
  config: configs/sparse_best.yaml
dense:
  config: configs/dense_best.yaml
fusion:
  k: 10
  w_dense: 0.4
  depth: 1000
rerank:
  model: cache/playground/ce/minilm_ft/epoch1
  dtype: float16
  max_length: 512
  max_query_tokens: 256
  doc_chars: 4000
  batch_size: 32
  query_clean:
  - code
  - html
  - urls
  - signature
  depth: 200
interpolate:
  a: 0.4
  norm: zscore
temporal:
  config: configs/rerank_temporal_fit_present.yaml
dedup:
  config: configs/final_dedup_end.yaml
