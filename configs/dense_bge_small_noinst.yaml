# Same document vectors as dense_bge_small; query encoded without the bge instruction.
system_name: dense_bge_small_noinst
description: "bge-small-en-v1.5 fp16, first 512 doc tokens, NO query instruction, HTML-stripped query (512 tok), FAISS IndexFlatIP"
model: BAAI/bge-small-en-v1.5
dtype: float16
domains: all
doc_mode: first
doc_max_tokens: 512
query_prefix: ""
query_max_tokens: 512
batch_size: 64
shard_size: 8192
depth: 100
candidate_depth: 1000
seed: 13
